<svg xmlns="http://www.w3.org/2000/svg" width="1024" height="1024" viewBox="0 0 1024 1024">
  <!-- Oxide Commander app icon (macOS grid: 824 px tile on a 1024 canvas). -->
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#343a43"/>
      <stop offset="1" stop-color="#15181c"/>
    </linearGradient>
    <linearGradient id="rust" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#f38a4a"/>
      <stop offset="1" stop-color="#c8461b"/>
    </linearGradient>
    <linearGradient id="pane" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#0f1215"/>
      <stop offset="1" stop-color="#0b0d10"/>
    </linearGradient>
    <filter id="shadow" x="-10%" y="-10%" width="120%" height="130%">
      <feDropShadow dx="0" dy="14" stdDeviation="16" flood-color="#000" flood-opacity="0.35"/>
    </filter>
  </defs>
  <g filter="url(#shadow)">
    <rect x="100" y="100" width="824" height="824" rx="185" fill="url(#bg)"/>
  </g>
  <rect x="101.5" y="101.5" width="821" height="821" rx="184" fill="none" stroke="#ffffff" stroke-opacity="0.08" stroke-width="3"/>

  <!-- left panel (active: rust frame and cursor row) -->
  <rect x="172" y="196" width="328" height="548" rx="30" fill="url(#pane)" stroke="url(#rust)" stroke-width="8"/>
  <rect x="204" y="236" width="150" height="20" rx="10" fill="#6b7480"/>
  <rect x="204" y="292" width="236" height="20" rx="10" fill="#4a525c"/>
  <rect x="190" y="338" width="292" height="60" rx="14" fill="url(#rust)"/>
  <rect x="210" y="358" width="200" height="20" rx="10" fill="#1a0d06" fill-opacity="0.75"/>
  <rect x="204" y="424" width="196" height="20" rx="10" fill="#4a525c"/>
  <rect x="204" y="480" width="250" height="20" rx="10" fill="#4a525c"/>
  <rect x="204" y="536" width="168" height="20" rx="10" fill="#4a525c"/>
  <rect x="204" y="592" width="214" height="20" rx="10" fill="#4a525c"/>
  <rect x="204" y="648" width="132" height="20" rx="10" fill="#4a525c"/>

  <!-- right panel -->
  <rect x="524" y="196" width="328" height="548" rx="30" fill="url(#pane)" stroke="#3b424b" stroke-width="8"/>
  <rect x="556" y="236" width="150" height="20" rx="10" fill="#6b7480"/>
  <rect x="556" y="292" width="206" height="20" rx="10" fill="#4a525c"/>
  <rect x="556" y="348" width="250" height="20" rx="10" fill="#4a525c"/>
  <rect x="556" y="404" width="176" height="20" rx="10" fill="#e9b949"/>
  <rect x="556" y="460" width="228" height="20" rx="10" fill="#e9b949"/>
  <rect x="556" y="516" width="150" height="20" rx="10" fill="#4a525c"/>
  <rect x="556" y="572" width="236" height="20" rx="10" fill="#4a525c"/>
  <rect x="556" y="628" width="184" height="20" rx="10" fill="#4a525c"/>

  <!-- function-key bar -->
  <rect x="172" y="778" width="118" height="50" rx="12" fill="#2a3037"/>
  <rect x="309" y="778" width="118" height="50" rx="12" fill="#2a3037"/>
  <rect x="446" y="778" width="132" height="50" rx="12" fill="url(#rust)"/>
  <rect x="597" y="778" width="118" height="50" rx="12" fill="#2a3037"/>
  <rect x="734" y="778" width="118" height="50" rx="12" fill="#2a3037"/>
</svg>
