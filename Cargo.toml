[package]
name = "mac-commander"
version = "0.1.1"
edition = "2024"
description = "Dual-panel file manager with Total Commander function keys and built-in terminals"
license = "MIT"
repository = "https://github.com/CR34L/mac-commander"

[dependencies]
alacritty_terminal = { version = "0.26", default-features = false }
chrono = { version = "0.4.45", default-features = false, features = ["clock"] }
eframe = "0.37.0"
plist = "1.10.4"
sysinfo = "0.40.4"
trash = "5.4.0"
