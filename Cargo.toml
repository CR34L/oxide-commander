[package]
name = "oxide-commander"
version = "0.3.1"
edition = "2024"
description = "Dual-panel file manager with Total Commander function keys and built-in terminals"
license = "MIT"
repository = "https://github.com/CR34L/oxide-commander"

[dependencies]
alacritty_terminal = { version = "0.26", default-features = false }
chrono = { version = "0.4.45", default-features = false, features = ["clock"] }
eframe = "0.37.0"
plist = "1.10.4"
sysinfo = "0.40.4"
trash = "5.4.0"

[target.'cfg(target_os = "macos")'.dependencies]
objc2 = "0.6"
objc2-app-kit = "0.3"
objc2-foundation = "0.3"
raw-window-handle = "0.6"
