# Builds "Oxide Commander.app" for Apple Silicon and publishes it as a GitHub Release.
# Trigger: push a tag like v0.1.2 (it must match the version in Cargo.toml).
# No certificates are stored in GitHub: release builds are signed ad hoc.
name: Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  macos-arm64:
    runs-on: macos-15  # Apple Silicon (arm64) runner
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0  # full history: the build number is the commit count

      - name: Check tag matches Cargo.toml version
        run: |
          VERSION=$(sed -n 's/^version = "\(.*\)"/\1/p' Cargo.toml | head -1)
          if [ "v$VERSION" != "$GITHUB_REF_NAME" ]; then
            echo "::error::Tag $GITHUB_REF_NAME does not match Cargo.toml version $VERSION"; exit 1
          fi

      - name: Install Rust
        run: rustup toolchain install stable --profile minimal && rustup default stable

      - uses: Swatinem/rust-cache@v2

      - name: Test
        run: cargo test --release

      - name: Build app bundle and installer disk image
        run: ./make-dmg.sh

      - name: Package
        run: |
          ditto -c -k --keepParent "dist/Oxide Commander.app" "Oxide-Commander-${GITHUB_REF_NAME}-macos-arm64.zip"
          cp dist/Oxide-Commander-*.dmg "Oxide-Commander-${GITHUB_REF_NAME}-macos-arm64.dmg"
          shasum -a 256 Oxide-Commander-*.dmg Oxide-Commander-*.zip > SHA256SUMS.txt

      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          {
            echo "Oxide Commander ${GITHUB_REF_NAME} for Apple Silicon Macs (M1 and later, macOS 11+)."
            echo
            echo "Download the dmg, open it and drag **Oxide Commander.app** onto Applications"
            echo "(or use the zip: unzip it and move the app to Applications)."
            echo
            echo "The app is not notarized. On first launch right-click it and choose **Open**,"
            echo "or run: \`xattr -dr com.apple.quarantine \"/Applications/Oxide Commander.app\"\`"
            echo
            echo "Tip: give Oxide Commander **Full Disk Access** (System Settings → Privacy & Security) so"
            echo "macOS stops asking about each folder; the sidebar has a link to that setting."
          } > notes.md
          gh release create "$GITHUB_REF_NAME" Oxide-Commander-*.dmg Oxide-Commander-*.zip SHA256SUMS.txt \
            --title "Oxide Commander $GITHUB_REF_NAME" --notes-file notes.md
