# Builds "Mac Commander.app" for Apple Silicon and publishes it as a GitHub Release.
# Trigger: push a tag like v0.1.0 (it must match the version in Cargo.toml).
name: Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  macos-arm64:
    runs-on: macos-15  # Apple Silicon (arm64) runner
    steps:
      - uses: actions/checkout@v4

      - name: Check tag matches Cargo.toml version
        run: |
          VERSION=$(sed -n 's/^version = "\(.*\)"/\1/p' Cargo.toml | head -1)
          if [ "v$VERSION" != "$GITHUB_REF_NAME" ]; then
            echo "::error::Tag $GITHUB_REF_NAME does not match Cargo.toml version $VERSION"; exit 1
          fi

      - name: Install Rust
        run: rustup toolchain install stable --profile minimal && rustup default stable

      - uses: Swatinem/rust-cache@v2

      - name: Test
        run: cargo test --release

      - name: Build app bundle
        run: ./bundle-macos.sh

      - name: Package
        run: |
          ditto -c -k --keepParent "dist/Mac Commander.app" "Mac-Commander-${GITHUB_REF_NAME}-macos-arm64.zip"
          shasum -a 256 Mac-Commander-*.zip > SHA256SUMS.txt

      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          cat > notes.md <<NOTES
          Mac Commander ${GITHUB_REF_NAME} for Apple Silicon Macs (M1 and later, macOS 11+).

          Download the zip, unzip it and drag **Mac Commander.app** to Applications.

          The app is not notarized by Apple. On first launch, right-click the app and choose
          **Open**, or run: \`xattr -dr com.apple.quarantine "/Applications/Mac Commander.app"\`
          NOTES
          gh release create "$GITHUB_REF_NAME" Mac-Commander-*.zip SHA256SUMS.txt \
            --title "Mac Commander $GITHUB_REF_NAME" --notes-file notes.md
